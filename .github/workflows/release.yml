name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # Same toolchain as CI and as go.mod, so a release is built by the
          # compiler the tests ran on.
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          # Publishes the release here…
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # …and the Homebrew formula to aramponi/homebrew-tap, which
          # GITHUB_TOKEN has no access to.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
