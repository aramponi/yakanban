name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # Same toolchain as CI and as go.mod, so a release is built by the
          # compiler the tests ran on.
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.5
      - name: Prepare Apple signing credentials
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          # Fail before publishing anything if the Apple setup is incomplete.
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          keychain="$RUNNER_TEMP/yakanban-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/yakanban-sign.p12"
          printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/yakanban-notary.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/yakanban-sign.p12" -k "$keychain" \
            -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application:/ {print $2}')"
          if ! [[ "$identity" =~ ^[A-Fa-f0-9]{40}$ ]]; then
            echo 'The P12 must contain exactly one valid Developer ID Application identity and private key.' >&2
            exit 1
          fi
          xcrun notarytool store-credentials yakanban-release --keychain "$keychain" \
            --key "$RUNNER_TEMP/yakanban-notary.p8" --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo 'MACOS_NOTARY_PROFILE=yakanban-release' >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/yakanban-sign.p12" "$RUNNER_TEMP/yakanban-notary.p8"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --timeout 50m
        env:
          # Publishes the release here…
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # …and the Homebrew formula to aramponi/homebrew-tap, which
          # GITHUB_TOKEN has no access to.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # …and the Scoop manifest to aramponi/scoop-bucket, likewise out of
          # GITHUB_TOKEN's reach.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      # GoReleaser's documented GitHub integration produces SLSA provenance
      # for every archive in the checksum manifest.
      - name: Attest release archives
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Publish provenance bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/provenance.sigstore.json
          gh release upload "$GITHUB_REF_NAME" dist/provenance.sigstore.json
      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir verified-release
          gh release download "$GITHUB_REF_NAME" --dir verified-release \
            --pattern 'checksums.txt*' --pattern '*.tar.gz' --pattern '*.zip' \
            --pattern provenance.sigstore.json
          cd verified-release
          cosign verify-blob checksums.txt \
            --signature checksums.txt.sig \
            --certificate checksums.txt.pem \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          shasum -a 256 --check checksums.txt
          for archive in *.tar.gz *.zip; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --bundle provenance.sigstore.json \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
      - name: Verify published macOS signatures
        run: |
          for arch in amd64 arm64; do
            mkdir "verified-release/$arch"
            tar -xzf "verified-release/yakanban_${GITHUB_REF_NAME#v}_darwin_${arch}.tar.gz" \
              -C "verified-release/$arch" yakanban
            codesign --verify --strict \
              -R="anchor apple generic and certificate leaf = H\"${MACOS_SIGN_IDENTITY}\"" \
              "verified-release/$arch/yakanban"
          done
      - name: Remove Apple signing credentials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/yakanban-release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/yakanban-release.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/yakanban-sign.p12" "$RUNNER_TEMP/yakanban-notary.p8"
