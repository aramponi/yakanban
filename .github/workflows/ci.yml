name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The toolchain comes from go.mod rather than `stable`: a runner silently
# moving to a newer Go is how golangci-lint ended up unable to parse the
# standard library it was asked to analyse, and it makes CI and a developer's
# machine disagree for reasons nobody chose.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # This includes TestBundledSkillsAreTheOnesInTheRepository. `skill check`
      # validates user-installed copies, so it would not add a source-tree gate.
      - run: go test -race ./...
      - run: go build ./cmd/yakanban

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
      - name: Build a release snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean
      - name: Verify the stamped snapshot version
        shell: bash
        run: |
          artifact() {
            jq -r --arg type "$1" '
              map(select(
                .type == $type and
                .extra.ID == "yakanban" and
                .goos == "linux" and
                .goarch == "amd64"
              )) | .[0].path // empty
            ' dist/artifacts.json
          }

          archive="$(artifact Archive)"
          binary="$(artifact Binary)"
          if [ -z "$archive" ] || [ -z "$binary" ]; then
            echo "no linux/amd64 yakanban artifact in dist/artifacts.json" >&2
            exit 1
          fi

          version="$(basename "$archive" | sed -E 's/^yakanban_(.*)_linux_amd64\.tar\.gz$/\1/')"
          reported="$("$binary" --version)"

          # Substring rather than equality: the exact line is cobra's version
          # template, and pinning CI to it would break the build the day
          # somebody rewords it. What matters is that the binary carries the
          # version it was built for instead of reporting "dev".
          case "$reported" in
            *"$version"*) echo "$reported" ;;
            *)
              echo "the binary reports \"$reported\", which does not carry $version" >&2
              exit 1
              ;;
          esac
